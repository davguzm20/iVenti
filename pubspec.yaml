name: iventi
description: "iVenti - Sistema de gestión de inventario y ventas"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  awesome_dialog: ^3.2.1
  pinput: ^5.0.1
  mailer: ^6.4.1
  encrypt: ^5.0.3
  flutter_dotenv: ^5.2.1
  mobile_scanner: ^6.0.5
  go_router: ^14.7.2
  image_picker: ^1.1.2
  flutter_slidable: ^4.0.0
  path_provider: ^2.1.5
  http: ^1.3.0
  pdf: ^3.10.7
  flutter_pdfview: ^1.3.2
  share_plus: ^10.1.4
  printing: ^5.11.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  shared_preferences: ^2.5.2
  flutter_local_notifications: ^18.0.1
  provider: ^6.1.2
  postgres: ^3.4.0
  intl: ^0.20.2
  
dev_dependencies:
  flutter_lints: ^5.0.0
  test: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.2
  build_runner: ^2.4.6
  patrol: ^4.6.1
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets: 
    - ".env"
    - ".env.test"
    - "lib/assets/iconos/"
    - "lib/shared/utils/messages.arb"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/iconos/iconoApp.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/iconos/iconoApp.png"
  remove_alpha_ios: true
